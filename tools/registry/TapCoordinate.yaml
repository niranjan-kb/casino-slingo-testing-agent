name: TapCoordinate
platforms: [android]
intents:
  - intent_authenticate
  - intent_navigate_to_screen
  - intent_navigate_to_game
  - intent_play_game
  - intent_play_bonus
risk_tier: medium
side_effects: [screen_transition]
description: |
  Coordinate tap (wraps appium_swipe with zero distance — appium_click does NOT
  accept x/y). Used for WebView/game elements where native element discovery
  fails.
